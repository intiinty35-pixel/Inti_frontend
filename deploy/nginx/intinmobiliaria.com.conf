# Sitio Nginx unico del servidor: frontend y API bajo el mismo dominio.
# Copiar a /etc/nginx/sites-available/ (o conf.d/).
# Luego: sudo certbot --nginx -d intinmobiliaria.com -d www.intinmobiliaria.com   (agrega HTTPS solo)
#
#   https://intinmobiliaria.com/       -> frontend (Next.js)  127.0.0.1:3102
#   https://intinmobiliaria.com/api/*  -> backend  (NestJS)   127.0.0.1:3103
#
# El backend NO tiene prefijo /api: /api/auth/login debe llegar como /auth/login.
# Por eso proxy_pass del bloque /api/ termina en "/" (Nginx reemplaza el prefijo
# /api/ por /). Sin esa barra final llegaria /api/auth/login y el backend daria 404.
server {
    listen 80;
    server_name intinmobiliaria.com www.intinmobiliaria.com;
    client_max_body_size 25m;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3103/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
