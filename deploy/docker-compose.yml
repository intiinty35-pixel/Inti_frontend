# Frontend (Next.js) — despliegue independiente.
# Escucha solo en 127.0.0.1:3102; el Nginx del servidor lo publica como intinmobiliaria.com.
# Llama al backend por la red Docker "ariz-net" (http://ariz_backend:4000); /api se reenvia ahi.
# Las variables NEXT_PUBLIC_* y BACKEND_URL se fijan en el BUILD: si cambian, reconstruir (sh deploy/deploy.sh).

name: ariz-web-frontend

services:
  frontend:
    build:
      context: ..
      args:
        BACKEND_URL: ${BACKEND_URL:-http://ariz_backend:4000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://intinmobiliaria.com}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}
        NEXT_PUBLIC_PAYMENT_YAPE_PLIN_NUMBER: ${NEXT_PUBLIC_PAYMENT_YAPE_PLIN_NUMBER:-}
        NEXT_PUBLIC_PAYMENT_BANK_NAME: ${NEXT_PUBLIC_PAYMENT_BANK_NAME:-}
        NEXT_PUBLIC_PAYMENT_BANK_ACCOUNT: ${NEXT_PUBLIC_PAYMENT_BANK_ACCOUNT:-}
        NEXT_PUBLIC_PAYMENT_BANK_CCI: ${NEXT_PUBLIC_PAYMENT_BANK_CCI:-}
        NEXT_PUBLIC_PAYMENT_ACCOUNT_HOLDER: ${NEXT_PUBLIC_PAYMENT_ACCOUNT_HOLDER:-}
        NEXT_PUBLIC_PAYMENT_TAX_ID: ${NEXT_PUBLIC_PAYMENT_TAX_ID:-}
    container_name: ariz_frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_URL: ${BACKEND_URL:-http://ariz_backend:4000}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-ariz_session}
    ports:
      - "127.0.0.1:3102:3000"
    networks:
      - ariz-net

networks:
  ariz-net:
    external: true
